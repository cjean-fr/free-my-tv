# One-off smoke test on a Google TV emulator, on this branch only: builds the APK, boots a Google TV image with
# hardware acceleration, installs, walks Settings > Inputs with the remote keys and saves screenshots.
name: Emulator smoke test

on:
  push:
    branches: [emulator-test]

permissions:
  contents: write   # to publish the screenshots on the emulator-test-shots-* branches

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the APK (build-tools 34, android-34, generic: no secrets)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/sdk" \
            "build-tools;34.0.0" "platforms;android-34" > /dev/null
          ANDROID_HOME="$RUNNER_TEMP/sdk" ./build.sh --generic
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on a Google TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google-tv
          arch: x86
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tools/emulator-test.sh
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-shots
          path: emulator-shots/
          if-no-files-found: warn
      - name: Publish the screenshots to a branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "emulator-test-shots-${{ github.run_id }}" || exit 0
          git rm -rf . > /dev/null 2>&1 || true
          mkdir -p shots
          cp emulator-shots/* shots/ 2>/dev/null || true
          git add shots
          git commit -m "Emulator smoke test screenshots" || exit 0
          git push origin "emulator-test-shots-${{ github.run_id }}" || echo "branch push failed, use the artifact"
